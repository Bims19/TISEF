<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tisefLogoTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="tisefLogoTitle">TISEF — Thrive Integrated Safety and Empowerment Foundation</title>
  <defs>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D3557"/>
      <stop offset="100%" stop-color="#14213D"/>
    </linearGradient>
  </defs>

  <!-- Outer embrace arcs: two protective arms curving around, representing shelter/community -->
  <path d="M 30 118 A 80 80 0 0 1 78 42" fill="none" stroke="#146C43" stroke-width="6" stroke-linecap="round"/>
  <path d="M 190 118 A 80 80 0 0 0 142 42" fill="none" stroke="#D4A017" stroke-width="6" stroke-linecap="round"/>

  <!-- Shield body -->
  <path d="M 110 46
           L 158 64
           L 158 112
           C 158 148 136 172 110 184
           C 84 172 62 148 62 112
           L 62 64
           Z"
        fill="url(#shieldFill)" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Inner rising path: a stylised upward arrow/sprout, representing empowerment and growth -->
  <path d="M 110 152
           L 110 96
           M 110 96 L 92 114
           M 110 96 L 128 114"
        fill="none" stroke="#F8F9FA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small gold dot at apex: singular point of hope/dignity -->
  <circle cx="110" cy="86" r="6" fill="#D4A017"/>
</svg>
